<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7078;
      --border: #e3e1da;
      --todo: #d97706;
      --todo-bg: #fff7ea;
      --done: #15803d;
      --done-bg: #eefaf1;
      --error-bg: #fdecec;
      --error: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #e8e9eb;
        --muted: #9aa0a8;
        --border: #30343b;
        --todo: #f59e0b;
        --todo-bg: #2a2214;
        --done: #4ade80;
        --done-bg: #14271b;
        --error-bg: #3a1a1a;
        --error: #fca5a5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 560px;
      margin: 48px auto;
      padding: 0 16px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 1.75rem; letter-spacing: -0.02em; }
    #summary { color: var(--muted); font-size: 0.9rem; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--todo);
      border-radius: 10px;
      transition: background 0.2s, border-color 0.2s;
    }
    li.done {
      background: var(--done-bg);
      border-left-color: var(--done);
    }
    li.done .description {
      color: var(--muted);
      text-decoration: line-through;
    }
    li.busy { opacity: 0.6; }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--done);
      cursor: pointer;
      flex-shrink: 0;
    }
    .description { flex: 1; word-break: break-word; }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--todo);
      background: var(--todo-bg);
      flex-shrink: 0;
    }
    li.done .badge { color: var(--done); background: transparent; }
    form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    form input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    form input[type="text"]:focus {
      outline: 2px solid var(--todo);
      outline-offset: 1px;
    }
    form button {
      padding: 12px 18px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--done);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    form button:disabled { opacity: 0.6; cursor: default; }
    .message {
      padding: 14px 16px;
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
    }
    .message.error { background: var(--error-bg); color: var(--error); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>To-do list</h1>
      <span id="summary"></span>
    </header>
    <form id="add-form">
      <input id="new-description" type="text" placeholder="What needs doing?"
             aria-label="New task description" maxlength="500" required>
      <button type="submit">Add</button>
    </form>
    <div id="status" class="message">Loading tasks…</div>
    <ul id="tasks"></ul>
  </main>

  <script>
    // Same origin when served by Express (express.static). If you open the file
    // from somewhere else, set this to 'http://localhost:3000' and enable CORS.
    const API_BASE = '';

    const list = document.getElementById('tasks');
    const status = document.getElementById('status');
    const summary = document.getElementById('summary');

    function showStatus(text, isError = false) {
      status.textContent = text;
      status.className = 'message' + (isError ? ' error' : '');
      status.hidden = !text;
    }

    function updateSummary(tasks) {
      const done = tasks.filter(t => t.done).length;
      summary.textContent = tasks.length ? `${done} of ${tasks.length} done` : '';
    }

    function renderTask(task) {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.setAttribute('aria-label', `Mark "${task.description}" as done`);

      const description = document.createElement('span');
      description.className = 'description';
      description.textContent = task.description; // textContent avoids HTML injection

      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = task.done ? 'Done' : 'To do';

      checkbox.addEventListener('change', async () => {
        const newDone = checkbox.checked;
        li.classList.add('busy');
        checkbox.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/tasks/${task.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ done: newDone }),
          });
          if (!res.ok) throw new Error(`Server responded ${res.status}`);
          task.done = newDone;
          li.classList.toggle('done', newDone);
          badge.textContent = newDone ? 'Done' : 'To do';
          updateSummary(currentTasks);
          showStatus('');
        } catch (err) {
          checkbox.checked = !newDone; // revert on failure
          showStatus(`Could not update task: ${err.message}`, true);
        } finally {
          li.classList.remove('busy');
          checkbox.disabled = false;
        }
      });

      li.append(checkbox, description, badge);
      return li;
    }

    let currentTasks = [];

    async function loadTasks() {
      try {
        const res = await fetch(`${API_BASE}/tasks`);
        if (!res.ok) throw new Error(`Server responded ${res.status}`);
        currentTasks = await res.json();

        list.replaceChildren(...currentTasks.map(renderTask));
        updateSummary(currentTasks);
        showStatus(currentTasks.length ? '' : 'No tasks yet. Add one above.');
      } catch (err) {
        showStatus(`Could not load tasks: ${err.message}`, true);
      }
    }

    const form = document.getElementById('add-form');
    const input = document.getElementById('new-description');
    const addButton = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault(); // stop the browser from reloading the page
      const description = input.value.trim();
      if (!description) return;

      addButton.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description, done: false }),
        });
        if (!res.ok) throw new Error(`Server responded ${res.status}`);
        input.value = '';
        await loadTasks(); // reload so the list shows the task with its real id
      } catch (err) {
        showStatus(`Could not add task: ${err.message}`, true);
      } finally {
        addButton.disabled = false;
        input.focus();
      }
    });

    loadTasks();
  </script>
</body>
</html>
